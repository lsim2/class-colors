<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Color Is Class?</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --ink: #f2f0ea;
      --ink-dim: #7a7a76;
      --ink-faint: #3a3a37;
      --dot: rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
      background-size: 34px 34px;
    }

    .eyebrow {
      padding: 28px 36px 0;
      font-size: 11px;
      letter-spacing: .18em;
      color: var(--ink-dim);
      text-transform: uppercase;
      font-weight: 700;
    }

    /* top bar */
    #bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      padding: 22px 24px 24px;
      margin: 22px 24px 0;
      border-bottom: 1px solid var(--ink-faint);
    }

    .bar-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 10px;
      transition: background .25s ease;
    }

    .bar-card:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .bar-card.active {
      background: rgba(255, 255, 255, 0.07);
    }

    .bar-card:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .bar-name {
      font-size: 10px;
      letter-spacing: .09em;
      color: var(--ink-dim);
      text-transform: uppercase;
      transition: color .25s ease;
    }

    .bar-card.active .bar-name {
      color: var(--ink);
    }

    .bar-minis {
      display: flex;
      width: 84px;
      height: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .bar-mini {
      flex: 1 1 0;
      height: 100%;
      min-width: 0;
    }

    .bar-underline {
      height: 2px;
      width: 100%;
      background: transparent;
      border-radius: 2px;
      margin-top: 2px;
      transition: background .25s ease;
    }

    .bar-card.active .bar-underline {
      background: var(--ink);
    }

    /* stage */
    #stage {
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 46px 8vw 80px;
      text-align: center;
    }

    .stage-eyebrow {
      font-size: 11px;
      letter-spacing: .2em;
      color: var(--ink-dim);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 18px;
      transition: opacity .25s ease;
    }

    .stage-title {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 900;
      letter-spacing: -.01em;
      text-transform: uppercase;
      margin: 0 0 30px;
      transition: opacity .25s ease;
    }

    .stage-hint {
      font-size: 13px;
      color: var(--ink-dim);
      max-width: 420px;
      line-height: 1.5;
      margin-bottom: 6px;
    }

    #centerField {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      max-width: 820px;
      margin-top: 36px;
    }

    .square-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      width: 64px;
    }

    .square {
      width: 64px;
      height: 64px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .sq-label {
      font-size: 10px;
      letter-spacing: .1em;
      color: var(--ink-dim);
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }

    #distChart {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 14px;
      max-width: 820px;
      margin-top: 14px;
      cursor: pointer;
    }

    #distChart:hover .dist-bar {
      filter: brightness(1.12);
    }

    .dist-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 38px;
    }

    .dist-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .dist-bar {
      width: 100%;
      height: 0px;
      transition: height .55s cubic-bezier(.22, .61, .36, 1);
    }

    .dist-label {
      font-size: 9px;
      letter-spacing: .08em;
      color: var(--ink-dim);
      text-transform: uppercase;
      text-align: center;
      margin-top: 9px;
      white-space: nowrap;
    }

    .sq-lang {
      display: block;
      color: var(--ink-faint);
      font-size: 9px;
      margin-top: 2px;
    }

    .ov-square {
      width: 52px;
      height: 52px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .ov-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      width: 60px;
    }

    .ov-label {
      font-size: 9px;
      letter-spacing: .08em;
      color: var(--ink-dim);
      text-transform: uppercase;
      text-align: center;
    }

    .footnote {
      margin-top: 30px;
      max-width: 480px;
      font-size: 12.5px;
      color: var(--ink-faint);
      text-align: center;
      font-style: italic;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }

    @media (max-width:640px) {
      .square {
        width: 48px;
        height: 48px;
      }

      .square-wrap {
        width: 48px;
      }

      #bar {
        gap: 2px;
        padding: 16px 10px 18px;
      }

      .bar-card {
        padding: 8px 8px;
      }

      #distChart.horiz {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 9px;
        width: 100%;
        max-width: 300px;
      }

      .dist-col.horiz-row {
        flex-direction: row;
        align-items: center;
        gap: 9px;
        width: 100%;
      }

      .dist-col.horiz-row .dist-label {
        order: 1;
        width: 56px;
        flex-shrink: 0;
        text-align: right;
        margin-top: 0;
        font-size: 9px;
      }

      .dist-col.horiz-row .dist-bar {
        order: 2;
        width: 0px;
        height: 14px;
        flex: none;
      }

      .dist-col.horiz-row .dist-count {
        order: 3;
        width: 20px;
        flex-shrink: 0;
        text-align: left;
        margin-bottom: 0;
        font-size: 10px;
      }
    }
  </style>
</head>

    function modeColors(responses) {
      const counts = {};
      responses.forEach(r => { counts[r.color] = (counts[r.color] || 0) + 1; });
      const max = Math.max(...Object.values(counts));
      return Object.keys(counts).filter(c => counts[c] === max);
    }
    subjects.forEach(s => {
      s.winners = modeColors(s.responses);
      s.sorted = [...s.responses].sort((a, b) => rankOf(a.color) - rankOf(b.color));
    });

    function multiColorSquare(colors, size) {
      const sq = document.createElement('div');
      sq.className = 'ov-square';
      sq.style.width = size + 'px'; sq.style.height = size + 'px';
      if (colors.length === 1) { sq.style.background = colorHex(colors[0]); }
      else {
        const step = 360 / colors.length;
        const stops = colors.map((c, i) => `${colorHex(c)} ${i * step}deg ${(i + 1) * step}deg`).join(',');
        sq.style.background = `conic-gradient(${stops})`;
      }
      return sq;
    }

            requestAnimationFrame(() => { item.style.opacity = '1'; item.style.transform = 'scale(1)'; });
          });
        });
      }, 180);
    }

    function showSubjectChart(idx) {
      const s = subjects[idx];
      stageEyebrow.style.opacity = '0';
      stageTitle.style.opacity = '0';
      setTimeout(() => {
        stageEyebrow.textContent = `${s.sorted.length} RESPONSE${s.sorted.length === 1 ? '' : 'S'} \u2014 CLICK CHART TO SEE ALL RESPONSES`;
        stageTitle.textContent = s.name.toUpperCase();
        stageTitle.style.display = 'block';
        stageFootnote.textContent = s.footnote || '';
        stageEyebrow.style.opacity = '1';
        stageTitle.style.opacity = '1';
      }, 180);

      const counts = {};
      s.sorted.forEach(r => { counts[r.color] = (counts[r.color] || 0) + 1; });
      const colorsInOrder = Object.keys(counts).sort((a, b) => rankOf(a) - rankOf(b));
      currentChartBarEls = buildDistChart(s, counts, colorsInOrder, 180);
      squaresShown = false;
    }

    function expandSquares(idx) {
      if (squaresShown || busy) return;
      busy = true;
      squaresShown = true;
      const s = subjects[idx];

      const wraps = s.sorted.map(r => {
        const wrap = document.createElement('div'); wrap.className = 'square-wrap';
        const sq = document.createElement('div'); sq.className = 'square';
        sq.style.background = colorHex(r.color);
        const lab = document.createElement('div'); lab.className = 'sq-label';
        lab.textContent = r.color;
        if (r.lang) {
          const span = document.createElement('span'); span.className = 'sq-lang'; span.textContent = r.lang;
          lab.appendChild(span);
        }
        wrap.appendChild(sq); wrap.appendChild(lab);
        centerField.appendChild(wrap);
        return { wrap, sq, lab, color: r.color };
      });

      wraps.forEach(({ sq, lab, color }, i) => {
        const last = sq.getBoundingClientRect();
        const originEl = currentChartBarEls[color];
        const first = originEl ? originEl.getBoundingClientRect() : last;
        const dx = (first.left + first.width / 2) - (last.left + last.width / 2);
        const dy = (first.top + first.height / 2) - (last.top + last.height / 2);
        const scale = Math.max(first.width / last.width, 0.12);
        sq.style.transition = 'none';
        sq.style.transformOrigin = 'center center';
        sq.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
        sq.style.opacity = '0.35';
        lab.style.transition = 'none';
        lab.style.opacity = '0';
      });

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          wraps.forEach(({ sq, lab }, i) => {
            sq.style.transition = `transform .55s cubic-bezier(.22,.61,.36,1) ${i * 30}ms, opacity .4s ease ${i * 30}ms`;
            sq.style.transform = 'translate(0,0) scale(1)';
            sq.style.opacity = '1';
            lab.style.transition = `opacity .4s ease ${i * 30 + 180}ms`;
            lab.style.opacity = '1';
          });
        });
      });

      setTimeout(() => { busy = false; }, wraps.length * 30 + 600);
    }

    function collapseSquares() {
      if (!squaresShown || busy) return;
      busy = true;
      const kids = [...centerField.children];
      kids.forEach(el => {
        el.style.transition = 'opacity .2s ease, transform .2s ease';
        el.style.opacity = '0';
        el.style.transform = 'scale(.7)';
      });
      setTimeout(() => {
        centerField.innerHTML = '';
        squaresShown = false;
        busy = false;
      }, 210);
    }

    distChart.addEventListener('click', () => {
      if (activeSubject === null) return;
      if (squaresShown) collapseSquares(); else expandSquares(activeSubject);
    });

    function getMaxBarHeight() { return window.innerWidth <= 640 ? 84 : 130; }
    function buildDistChart(s, counts, colorsInOrder, startDelay) {
      const maxCount = Math.max(...colorsInOrder.map(c => counts[c]));
      const horizontal = window.innerWidth <= 640;
      distChart.classList.toggle('horiz', horizontal);
      const maxExtent = horizontal ? 110 : getMaxBarHeight();
      distChart.style.minHeight = horizontal ? '' : (getMaxBarHeight() + 42) + 'px';
      const barMap = {};

      const cols = colorsInOrder.map(color => {
        const count = counts[color];
        const col = document.createElement('div');
        col.className = 'dist-col' + (horizontal ? ' horiz-row' : '');
        const num = document.createElement('div'); num.className = 'dist-count';
        num.textContent = count; num.style.opacity = '0';
        const bar = document.createElement('div'); bar.className = 'dist-bar';
        bar.style.background = colorHex(color);
        bar.style.transition = 'none';
        if (horizontal) { bar.style.width = '0px'; bar.style.height = ''; }
        else { bar.style.height = '0px'; bar.style.width = ''; }
        const lab = document.createElement('div'); lab.className = 'dist-label'; lab.textContent = color;
        lab.style.opacity = '0';
        col.appendChild(num); col.appendChild(bar); col.appendChild(lab);
        distChart.appendChild(col);
        barMap[color] = bar;
        return { bar, num, lab, targetExtent: Math.max((count / maxCount) * maxExtent, 6) };
      });

      setTimeout(() => {
        cols.forEach(({ bar, num, lab, targetExtent }, i) => {
          if (horizontal) {
            bar.style.transition = `width .5s cubic-bezier(.22,.61,.36,1) ${i * 45}ms`;
            bar.style.width = targetExtent + 'px';
          } else {
            bar.style.transition = `height .5s cubic-bezier(.22,.61,.36,1) ${i * 45}ms`;
            bar.style.height = targetExtent + 'px';
          }
          num.style.transition = `opacity .35s ease ${i * 45 + 250}ms`;
          num.style.opacity = '1';
          lab.style.transition = `opacity .35s ease ${i * 45 + 250}ms`;
          lab.style.opacity = '1';
        });
      }, startDelay);

      return barMap;
    }

    function handleSelect(idx) {
      if (busy) return;
      busy = true;

      if (activeSubject === idx) {
        // deselect -> back to overview
        activeSubject = null;
        setBarActive(-1);
        clearCenter(() => { showOverview(); busy = false; });
        return;
      }

      activeSubject = idx;
      setBarActive(idx);
      clearCenter(() => {
        showSubjectChart(idx);
        setTimeout(() => { busy = false; }, 500);
      });
    }

    // init
    showOverview();
  </script>
</body>

</html>
